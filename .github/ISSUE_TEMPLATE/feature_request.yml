name: 功能建议
description: 新增模块、改编流程、补充参考或模板
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options: [新功能模块, 改进既有流程, 新增/修订模板, 新增写作参考, 文档口径, 其它]
    validations:
      required: true
  - type: input
    id: trigger
    attributes:
      label: 触发词（用户会怎么说）
      placeholder: 写篇推文 / 复核 / 拆文库
  - type: textarea
    id: problem
    attributes:
      label: 现在的问题
      description: 哪个场景下不够用或走不通——尽量给一次真实使用的例子
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 落点建议（modules/03_xx、templates/xx、references/xx）；有阈值/停止条件请写明
  - type: checkboxes
    id: gate
    attributes:
      label: 自检
      options:
        - label: 我已确认这不是已有模块能覆盖的场景（查过 modules/02 索引）
        - label: 该改动不会要求新增二级跳转（协议权威=00，步骤权威=03_26）
